 if(l>0){const n=Math.hypot(fw,st);P.x+=(-Math.sin(yaw)*fw+Math.cos(yaw)*st)/n*l*sp;P.z+=(-Math.cos(yaw)*fw-Math.sin(yaw)*st)/n*l*sp;pushOut(P,.6,py);P.x=Math.max(-38,Math.min(38,P.x));P.z=Math.max(-38,Math.min(38,P.z))}
 {let gy=0;for(const o of obs)if(Math.abs(P.x-o.x)<o.w+.3&&Math.abs(P.z-o.z)<o.d+.3&&py>=o.h-.4)gy=Math.max(gy,o.h);pvy-=22*dt;py+=pvy*dt;if(py<=gy){py=gy;pvy=0;gnd=1}else gnd=0}
 cd-=dt;cbt-=dt;if(cbt<=0)cb=0;upFx(dt);if(rel>0){rel-=dt;if(rel<=0)ammo=MAG}
 if(K.f||K.sp)shoot();
 for(const e of en.slice()){if(e.bt==2){e.sm=(e.sm||5)-dt;if(e.sm<=0){e.sm=7;mkE();mkE()}}if(e.kx){e.g.position.x+=e.kx*dt;e.g.position.z+=e.kz*dt;e.kx*=.9;e.kz*=.9;if(Math.abs(e.kx)<.3)e.kx=0;pushOut(e.g.position,.6)}const dx=P.x-e.g.position.x,dz=P.z-e.g.position.z,d=Math.hypot(dx,dz);e.g.rotation.y=Math.atan2(dx,dz);zAnim(e,d,dt);
  if(d>(e.tp==3?[2.8,9,16][e.bt]:1.3)){const s=Math.min(4.2,1.6+wave*.2)*e.sp*(e.tp==2?1.6:e.tp==1||e.tp==3?.7:1)*dt;e.g.position.x+=dx/d*s;e.g.position.z+=dz/d*s;pushOut(e.g.position,.6);}
  e.at-=dt;const rng=e.tp==3?[3.6,12,24][e.bt]:1.9;if(e.at<=0&&d<rng+.3){e.at=(e.tp==3?1.3:.9)+Math.random()*.4;e.sw=.3;
   ray2.set(new T3.Vector3(e.g.position.x,1.5,e.g.position.z),new T3.Vector3(dx,0,dz).normalize());const bh=ray2.intersectObjects(solid);
   if(!bh.length||bh[0].distance>d){if(d<rng+.3)dmg((3+Math.min(wave,5))*(e.tp==3?2:1))}else if(bh[0].object.isB&&bh[0].distance<rng+.6){const b=bh[0].object;b.bh-=12;b.material.color.setHSL(.07,.3,.12+b.bh/400);burst(b.position.x,1,b.position.z,2,0xb08968,3);if(b.bh<=0)rmB(b)}}
  e.fl-=dt;e.mat.emissive.setHex(e.fl>0?0xffffff:0)}
 if(hp<=0){hp=0;die()}
 if(!en.length&&play){wt+=dt;if(wt>2.5){wt=0;nextWave()}}}
function frame(){const now=performance.now(),dt=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;
 if(play)up(dt);
 cam.position.set(P.x+(Math.random()-.5)*shake*.3,1.7+py+Math.abs(Math.sin(TT*(sprint?11:8)))*(jv.x||jv.y?(py>0?0:.05):0)+(Math.random()-.5)*shake*.3,P.z);cam.rotation.set(pitch,yaw,0);gun.visible=!cs;if(cs){cs.t+=dt;cs.f(Math.min(1,cs.t/cs.d));if(cs.t>=cs.d)endCut()}
 cam.fov+=((wi==3?38:sprint&&jv.y<-.3?82:75)-cam.fov)*.2;cam.updateProjectionMatrix();gun.scale.z=[1,.9,.8,1.5,.5,.7,1.4,1.3][wi];kick*=.82;gun.position.z=-.55+kick*.08;gun.rotation.x=kick*.06+(rel>0?-.6:0);gun.position.y+=((rel>0?-.4:-.22)-gun.position.y)*.2;if(mft>0){mft-=dt;if(mft<=0)mf.visible=false}
 hurt=Math.max(0,hurt-dt*2);q('hurt').style.opacity=hurt;hm=Math.max(0,hm-dt);q('cx').style.color=hm>0?'#f33':SK[SV.skin].x;
 const bs=en.find(e=>e.tp==3);q('bh').style.display=bs?'block':'none';if(bs)q('bf').style.width=Math.max(0,bs.hp/bs.mh*100)+'%';q('af').style.width=(AMX()?ar/AMX()*100:0)+'%';q('hf').style.width=hp+'%';q('hf').style.background=hp>50?'#4caf50':hp>25?'#f5c518':'#e53935';
 q('hud').innerHTML=`<span>🌊 ${wave}</span><span>⭐ ${score}</span><span>${WP[wi].n} ${rel>0?'...':ammo}/${MAG}</span><span>💣 ${gn}</span><span>🧱 ${bk}</span><span>👾 ${en.length}</span>${cb>1?'<span>🔥x'+cb+'</span>':''}`;
 R.render(sc,cam);requestAnimationFrame(frame)}
const jb=q('jb'),jk=q('jk');let jid=null,jv={x:0,y:0};
function jm(e){const r=jb.getBoundingClientRect(),mx=r.width/2;let dx=e.clientX-r.left-mx,dy=e.clientY-r.top-mx;const l=Math.hypot(dx,dy);if(l>mx){dx*=mx/l;dy*=mx/l}jv={x:dx/mx,y:dy/mx};jk.style.transform=`translate(${dx}px,${dy}px)`}
jb.onpointerdown=e=>{jid=e.pointerId;jb.setPointerCapture(e.pointerId);jm(e)};jb.onpointermove=e=>{if(e.pointerId==jid)jm(e)};
jb.onpointerup=jb.onpointercancel=()=>{jid=null;jv={x:0,y:0};jk.style.transform=''};
const fb=q('fb');fb.onpointerdown=e=>{K.f=1;fb.setPointerCapture(e.pointerId)};fb.onpointerup=fb.onpointercancel=()=>K.f=0;
q('rb').onpointerdown=reload;
const L={},lk=q('lk');lk.onpointerdown=e=>{L[e.pointerId]=[e.clientX,e.clientY];lk.setPointerCapture(e.pointerId)};
lk.onpointermove=e=>{const l=L[e.pointerId];if(!l||!play)return;const sn=[.004,.006,.01][SV.sn??1];yaw-=(e.clientX-l[0])*sn;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-l[1])*sn));l[0]=e.clientX;l[1]=e.clientY};
lk.onpointerup=lk.onpointercancel=e=>delete L[e.pointerId];
const km={w:'w',a:'a',s:'s',d:'d',' ':'sp'};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(km[k])K[km[k]]=1;if(k=='r')reload();if(k=='q')sw();if(k=='g')thr();if(k=='e')place();if(k=='c')jump()});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(km[k])K[km[k]]=0});
addEventListener('contextmenu',e=>e.preventDefault());
function applySkin(){const s=SK[SV.skin];gun.children[0].material.color.setHex(s.c);mf.material.color.setHex(s.f)}
function sw(){if(!play)return;AM[wi]=ammo;wi=(wi+1)%WP.length;MAG=WP[wi].m;ammo=AM[wi];rel=0;cd=.3}
function menu(p){const m=q('m');m.style.display='flex';m.innerHTML=`<h1>🔫 Arena FPS</h1><div>🪙 ${SV.coins} · Best ${SV.best}</div><p>Left stick: move · Drag screen: aim<br>FIRE hold · RELOAD · SWAP weapon<br>Headshots = 3x damage<br>RUN · JUMP · 🧱 build cover · 💣 grenade<br>Brown = brute · Teal = runner · Boss every 5-10 waves</p>${p?'<button class=k id=rs>Resume</button>':''}<button class=k id=st>${p?'New game':'Play'}</button><button class=k id=sk>🎨 Skins</button><button class=k id=se>⚙ Sensitivity: ${['Low','Med','High'][SV.sn??1]}</button>${(SV.al||0)<3?'<button class=k id=ar2>🛡 Armor Lv '+(SV.al||0)+'/3 → 🪙'+[150,300,500][SV.al||0]+'</button>':'<div>🛡 Armor MAX</div>'}`;
 if(p)q('rs').onclick=()=>{m.style.display='none';play=true};q('st').onclick=begin;q('sk').onclick=()=>skins(p);q('se').onclick=()=>{SV.sn=((SV.sn??1)+1)%3;save();menu(p)};if(q('ar2'))q('ar2').onclick=()=>{const c=[150,300,500][SV.al||0];if(SV.coins>=c){SV.coins-=c;SV.al=(SV.al||0)+1;save();menu(p)}}}
function skins(p){const m=q('m');m.innerHTML=`<h2>🎨 Gun skins</h2><div>🪙 ${SV.coins}</div><div id=sg></div><button class=k id=bk>Back</button>`;
 q('sg').innerHTML=Object.keys(SK).map(k=>{const s=SK[k],o=SV.own.includes(k);return `<div class=sc data-k=${k} style="border-color:#${('000000'+s.c.toString(16)).slice(-6)}"><b>${s.n}</b><br>${SV.skin==k?'✔ Equipped':o?'Equip':'🪙 '+s.p}</div>`}).join('');
 q('sg').querySelectorAll('.sc').forEach(d=>d.onclick=()=>{const k=d.dataset.k,s=SK[k];if(!SV.own.includes(k)){if(SV.coins<s.p)return;SV.coins-=s.p;SV.own.push(k)}SV.skin=k;save();applySkin();skins(p)});
 q('bk').onclick=()=>menu(p)}
const PT=[],GR=[],DR=[],pg=new T3.BoxGeometry(.12,.12,.12);
function burst(x,y,z,n,c,sp){for(let i=0;i<n;i++){const m=new T3.Mesh(pg,new T3.MeshBasicMaterial({color:c}));m.position.set(x,y,z);m.v=new T3.Vector3((Math.random()-.5)*sp,Math.random()*sp*.8,(Math.random()-.5)*sp);m.life=.7+Math.random()*.5;sc.add(m);PT.push(m)}}
function drop(x,z){const t=Math.floor(Math.random()*3),m=new T3.Mesh(new T3.BoxGeometry(.5,.5,.5),new T3.MeshLambertMaterial({color:[0xf5c518,0x4caf50,0x2196f3][t],emissive:[0x554400,0x114411,0x0d3b66][t]}));m.position.set(x,2,z);m.t=t;m.vy=0;sc.add(m);DR.push(m)}
function killE(e,hd){burst(e.g.position.x,1.2,e.g.position.z,16,0x7a0c0c,7);if(e.bt==1)boom(e.g.position);if(e.tp==3)banner('BOSS DOWN!');if(Math.random()<.3||e.tp==3){drop(e.g.position.x,e.g.position.z);if(e.tp==3)drop(e.g.position.x+1,e.g.position.z)}sc.remove(e.g);en.splice(en.indexOf(e),1);cb++;cbt=3;score+=Math.round((hd?150:100)*(e.tp==3?10:e.tp==1?3:1)*(1+Math.min(cb,10)*.1));kills++;SV.coins+=e.tp==3?30:e.tp==1?5:1;snd(520,.12)}
function thr(){if(!play||gn<=0)return;gn--;const m=new T3.Mesh(new T3.SphereGeometry(.18,8,6),new T3.MeshLambertMaterial({color:0x2e7d32}));m.position.copy(cam.position);m.v=new T3.Vector3(0,0,-1).applyEuler(cam.rotation).multiplyScalar(15);m.v.y+=4;m.t=1.7;sc.add(m);GR.push(m);snd(260,.1)}
function boom(p){burst(p.x,.8,p.z,40,0xff8a1f,12);snd(60,.4);shake=.8;
 for(const e of en.slice()){const dx=e.g.position.x-p.x,dz=e.g.position.z-p.z,d=Math.hypot(dx,dz);if(d<7){e.hp-=Math.ceil(6*(1-d/7));e.fl=.15;e.kx=dx/(d||1)*14;e.kz=dz/(d||1)*14;if(e.hp<=0)killE(e,0)}}
 const d=Math.hypot(P.x-p.x,P.z-p.z);if(d<4){dmg(Math.round((4-d)*6))}}
function upFx(dt){
 for(let i=PT.length-1;i>=0;i--){const m=PT[i];m.v.y-=18*dt;m.position.addScaledVector(m.v,dt);if(m.position.y<.06){m.position.y=.06;m.v.y*=-.45;m.v.x*=.7;m.v.z*=.7}m.rotation.x+=dt*6;m.life-=dt;if(m.life<=0){sc.remove(m);m.material.dispose();PT.splice(i,1)}}
 for(let i=GR.length-1;i>=0;i--){const m=GR[i],ox=m.position.x,oz=m.position.z;m.v.y-=18*dt;m.position.addScaledVector(m.v,dt);if(m.position.y<.18){m.position.y=.18;m.v.y*=-.5;m.v.x*=.8;m.v.z*=.8}
  for(const o of obs)if(Math.abs(m.position.x-o.x)<o.w+.18&&Math.abs(m.position.z-o.z)<o.d+.18&&m.position.y<4){m.position.x=ox;m.position.z=oz;m.v.x*=-.5;m.v.z*=-.5}
  m.t-=dt;if(m.t<=0){boom(m.position);sc.remove(m);GR.splice(i,1)}}
 for(let i=DR.length-1;i>=0;i--){const m=DR[i];m.vy-=18*dt;m.position.y+=m.vy*dt;if(m.position.y<.4){m.position.y=.4;m.vy*=-.4}m.rotation.y+=dt*2;
  if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<1.5){if(m.t==1)hp=Math.min(100,hp+30);else if(m.t==2)ar=Math.min(AMX(),ar+40);else{ammo=MAG;gn=Math.min(6,gn+1);bk=Math.min(12,bk+1)}sc.remove(m);DR.splice(i,1);snd(700,.1)}}
 shake=Math.max(0,shake-dt*2)}
const BL=[];
function dmg(n){hurt=1;snd(90,.15);if(ar>0){const ab=Math.min(ar,n*[0,.4,.6,.75][SV.al||0]);ar-=ab;n-=ab}hp-=n}
let bcnt=0;function mkB(){mkE();const e=en[en.length-1],bt=bcnt++%3;e.tp=3;e.bt=bt;e.g.scale.setScalar([2.1,2.4,1.8][bt]);e.mat.color.setHex([0xb05050,0x9fdc6a,0xa070d0][bt]);{const h=e.g.children[4],wm=new T3.MeshLambertMaterial({color:0x333333}),W=(geo,y,c)=>{const o=new T3.Mesh(geo,c||wm);o.position.y=y;o.castShadow=true;h.add(o)};
if(bt==0){W(new T3.CylinderGeometry(.05,.05,1.6,6),1.0);W(new T3.BoxGeometry(.7,.4,.4),1.85,new T3.MeshLambertMaterial({color:0x666666}))}
if(bt==1)W(new T3.CylinderGeometry(.16,.2,.8,8),1.1,new T3.MeshLambertMaterial({color:0x3a7a2a,emissive:0x1a4a10}));
if(bt==2){W(new T3.BoxGeometry(.1,1,.14),1.0);W(new T3.BoxGeometry(.12,.3,.2),.45)}}e.hp=e.mh=Math.round((30+wave*3)*[1,1.3,.9][bt])}
function jump(){if(play&&gnd){pvy=8.2;gnd=0}}
function place(){if(!play||bk<=0)return;const x=Math.round((P.x-Math.sin(yaw)*3.5)/2)*2,z=Math.round((P.z-Math.cos(yaw)*3.5)/2)*2;if(Math.hypot(x-P.x,z-P.z)<1.8||Math.abs(x)>36||Math.abs(z)>36)return;for(const o of obs)if(Math.abs(x-o.x)<o.w+1&&Math.abs(z-o.z)<o.d+1)return;bk--;const m=box(x,z,2,2,1.5,0x8d6e63);m.bh=100;m.isB=1;BL.push(m);burst(x,.8,z,6,0xb08968,3);snd(200,.06)}

function cut(s,d,f,dn){cs={t:0,d,f,dn};play=false;K.f=0;document.body.classList.add('cin');q('cb1').style.height=q('cb2').style.height='12%';q('sub').textContent=s;q('sub').style.opacity=1;q('m').style.display='none'}
